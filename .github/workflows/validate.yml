name: Validate Public Rules
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r openclash/validation/requirements.txt
      - run: python -m unittest discover -s openclash/validation -p 'test_validate_public.py'
      - run: python openclash/validation/validate_public.py --staged